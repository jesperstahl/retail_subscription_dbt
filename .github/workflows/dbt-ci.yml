name: dbt CI

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:

jobs:

  dbt-build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:
          python-version: '3.12'

      - run: pip install dbt-postgres

      - run: dbt deps

      - run: dbt build